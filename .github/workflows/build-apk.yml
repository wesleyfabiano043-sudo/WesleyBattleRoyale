name: Build Wesley Battle Royale APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          test -n "$ZIP_FILE"
          mkdir source
          unzip -q "$ZIP_FILE" -d source

      - name: Compilar APK
        run: |
          PROJECT=$(find source -name settings.gradle | head -n1)
          cd "$(dirname "$PROJECT")"
          gradle --no-daemon assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Wesley-Battle-Royale-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
